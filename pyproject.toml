[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "gputil>=1.4.0",
    "insightface>=1.0.1",
    "ipython>=9.16.1",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "torchdata>=0.11.0",
    "torchtext>=0.18.0",
    "ultralytics>=8.4.123",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
workspace = "workspace:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
